# Enedis service.
fetch_data:
  name: Fetch data
  fields:
    entry:
      name: Entry
      required: true
      selector:
        config_entry:
          integration: myelectricaldata
    service:
      name: Service
      required: true
      default: daily_production
      selector:
        select:
          translation_key: "services_choice"
          mode: dropdown
          options:
            - label: Daily Consumption
              value: daily_consumption
            - label: Detail Consumption
              value: consumption_load_curve
            - label: Daily Production
              value: daily_production
            - label: Detail Production
              value: production_load_curve
    start_date:
      name: Start Date
      required: true
      selector:
        date:
    end_date:
      name: End Date
      required: true
      selector:
        date:
    price:
      name: Price
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.001
          mode: box
    off_price:
      name: Offpeak Price
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.001
          mode: box

# Enedis service.
clear_data:
  name: Clear data
  description: clear data statistics in your database
  fields:
    statistic_id:
      name: Statistic Id
      description: set statistic_id , you pick in statistic from developer page
      required: true
      selector:
        entity:
          filter:
            integration: myelectricaldata
            domain: sensor
    start_date:
      name: Start Date
      description: Only clear data from this date onward. Leave empty with no end date to clear all data.
      required: false
      selector:
        date:
    end_date:
      name: End Date
      description: Only clear data up to (but excluding) this date. Leave empty with no start date to clear all data.
      required: false
      selector:
        date:

# Enedis service.
rebuild_data:
  name: Rebuild data
  description: Recompute a statistic's cumulative sum from its own local history (no Enedis API call)
  fields:
    statistic_id:
      name: Statistic Id
      description: set statistic_id , you pick in statistic from developer page
      required: true
      selector:
        entity:
          filter:
            integration: myelectricaldata
            domain: sensor
